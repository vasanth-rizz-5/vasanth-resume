<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vasanthrizz Resume</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f5f5f5;
            overflow:hidden;
        }

        header{
            height:60px;
            background:#0d6efd;
            color:#fff;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 20px;
        }

        header h2{
            font-size:22px;
        }

        .btn{
            text-decoration:none;
            background:#fff;
            color:#0d6efd;
            padding:10px 18px;
            border-radius:6px;
            font-weight:bold;
            transition:.3s;
        }

        .btn:hover{
            background:#e9ecef;
        }

        .viewer{
            width:100%;
            height:calc(100vh - 60px);
        }

        iframe{
            width:100%;
            height:100%;
            border:none;
        }
    </style>
</head>
<body>

<header>
    <h2>Vasanth Resume</h2>

    <a href="resume.pdf" download class="btn">
        Download Resume
    </a>
</header>

<div class="viewer">
    <iframe src="resume.pdf"></iframe>
</div>

</body>
</html>
